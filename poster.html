<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The World in One Picture — Friday 20 November 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; }
  body {
    background: #f6f1e5;
    color: #16213a;
    font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif;
    padding: 22px 36px 20px 36px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- masthead: the day, named big ---------- */
  header { text-align: center; }
  .kicker {
    display: flex; align-items: center; gap: 18px;
    font-size: 23px; font-weight: 700; letter-spacing: 7px; color: #16213a;
  }
  .kicker::before, .kicker::after {
    content: ""; flex: 1; height: 4px; background: #c1272d;
  }
  .kicker span { white-space: nowrap; }
  .date {
    margin-top: 8px;
    font-size: 55px; font-weight: 800; letter-spacing: 1px; line-height: 1.05;
    white-space: nowrap;
  }
  .date .weekday { color: #c1272d; }
  .rule {
    margin-top: 10px;
    border-top: 5px solid #16213a;
    border-bottom: 2px solid #16213a;
    height: 9px;
  }

  /* ---------- panels: the picture carries the story ---------- */
  .panel {
    position: relative;
    overflow: hidden;
    border: 3px solid #16213a;
    border-radius: 3px;
    background: #22304a;
  }
  .panel img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .panel figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 44px 22px 15px 22px;
    background: linear-gradient(to bottom,
      rgba(8, 12, 22, 0) 0%,
      rgba(8, 12, 22, 0.45) 42%,
      rgba(8, 12, 22, 0.90) 100%);
    color: #ffffff;
  }
  .panel h2 {
    font-weight: 800; text-transform: uppercase;
    line-height: 1.08; letter-spacing: 0.3px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
  }
  .panel p {
    margin-top: 6px;
    font-size: 28px; line-height: 1.25; color: #e9edf5;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }

  .hero { margin-top: 14px; height: 330px; flex: 0 0 auto; }
  .hero h2 { font-size: 46px; }
  .hero figcaption { padding-top: 68px; }

  .grid {
    margin-top: 14px;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
  }
  .grid h2 { font-size: 40px; }
</style>
</head>
<body>

<header>
  <div class="kicker"><span>THE WORLD IN ONE PICTURE</span></div>
  <div class="date"><span class="weekday">FRIDAY</span> 20 NOVEMBER 2026</div>
  <div class="rule"></div>
</header>

<figure class="panel hero">
  <img src="assets/hero-kyiv.webp" alt="Three bridges across the Dnipro in Kyiv in flames, one span collapsed into the river, with the golden-domed Kyiv skyline behind">
  <figcaption>
    <h2>Russia Hits Three Kyiv Bridges</h2>
    <p>Seven killed, 17 hurt as Dnipro crossings shut</p>
  </figcaption>
</figure>

<div class="grid">

  <figure class="panel">
    <img src="assets/panel-cyclone.webp" alt="A huge cyclone spiral over the Bay of Bengal coast, with flooded land and shelters below">
    <figcaption>
      <h2>Cyclone Akvan Hits Odisha</h2>
      <p>372,000 evacuated &mdash; no deaths reported</p>
    </figcaption>
  </figure>

  <figure class="panel">
    <img src="assets/panel-markets.webp" alt="A giant stock market screen with a steep red chart line plunging, a computer chip in front, traders silhouetted below">
    <figcaption>
      <h2>AI Sell-Off Goes Global</h2>
      <p>Nikkei -5%, Nasdaq -5.3%, Nvidia -14%</p>
    </figcaption>
  </figure>

  <figure class="panel">
    <img src="assets/panel-cop31.webp" alt="A climate summit hall at night, flags hanging above empty negotiation tables, a globe and solar panels in front">
    <figcaption>
      <h2>COP31 Goes Into Overtime</h2>
      <p>No deal on final day &mdash; fossil-fuel text gone</p>
    </figcaption>
  </figure>

  <figure class="panel">
    <img src="assets/panel-cars.webp" alt="Rows of new electric cars behind a fence and barrier at a port, with the American and Chinese flags flying">
    <figcaption>
      <h2>US Nears Ban on Chinese Cars</h2>
      <p>Deal close, Mercedes spared</p>
    </figcaption>
  </figure>

</div>

</body>
</html>
